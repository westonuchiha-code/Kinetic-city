<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Gravitation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Tilt+Neon&family=Bungee&display=swap" rel="stylesheet">
<style>
/* Layout idea: full-bleed game canvas; DOM overlays sit on top as left-anchored neon panels. Single dark theme by design. */
:root{
  --bg:#05060b;
  --panel:rgba(9,11,20,.93);
  --line:rgba(120,140,190,.22);
  --ink:#e8ecf7;
  --dim:#8790aa;
  --cyan:#3ce0ff;
  --pink:#ff3d8b;
  --gold:#ffc24a;
  --good:#38d0ff;
  --evil:#ff3355;
  --font-display:"Tilt Neon","Chakra Petch","Segoe UI",system-ui,sans-serif;
  --font-body:"Chakra Petch","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;font-family:var(--font-body);color:var(--ink)}
#game{position:fixed;display:block}
.layer{position:fixed;inset:0;display:none;z-index:10}
.layer.on{display:flex}
button{font-family:inherit;color:inherit}
.nav{outline:none}
/* ---------- glyphs ---------- */
.g{display:inline-flex;vertical-align:middle;line-height:0}
.g svg{height:1.5em;width:auto}
/* ---------- title ---------- */
#title{flex-direction:column;justify-content:flex-end;padding:3vh 6vw 7vh;overflow-y:auto;background:linear-gradient(90deg,rgba(5,6,11,.92) 0%,rgba(5,6,11,.65) 38%,rgba(5,6,11,0) 70%)}
.logo{font-family:var(--font-display);font-size:clamp(34px,min(9vw,13vh),118px);line-height:.92;margin:0;color:#dffcff;letter-spacing:.02em;text-wrap:balance;
  text-shadow:0 0 6px #fff,0 0 18px var(--cyan),0 0 42px var(--cyan),0 0 80px rgba(60,224,255,.6)}
.logo span{display:block;color:#ffe0ee;text-shadow:0 0 6px #fff,0 0 18px var(--pink),0 0 42px var(--pink),0 0 80px rgba(255,61,139,.6);animation:flick 6s infinite}
@keyframes flick{0%,18%,22%,60%,100%{opacity:1}19%,21%{opacity:.35}61%{opacity:.6}}
#tmenu{margin-top:26px}
.menu{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.mbtn{background:transparent;border:0;border-left:3px solid transparent;padding:8px 18px 8px 14px;font-size:clamp(18px,2vw,24px);font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);cursor:pointer;transition:color .12s,border-color .12s,background .12s}
.mbtn:hover,.mbtn.focus{color:#fff;border-left-color:var(--cyan);background:linear-gradient(90deg,rgba(60,224,255,.16),rgba(60,224,255,0))}
.mbtn[disabled]{opacity:.35;cursor:default}
.padstat{margin-top:28px;display:flex;gap:10px;align-items:center;font-size:14px;color:var(--dim);max-width:60ch;line-height:1.4}
.padstat .dot{width:9px;height:9px;border-radius:50%;background:#555;flex:none}
.padstat.ok .dot{background:#4dff9a;box-shadow:0 0 10px #4dff9a}
.padstat.warn .dot{background:var(--gold);box-shadow:0 0 10px var(--gold)}
/* ---------- dialogue ---------- */
#dlg{align-items:flex-end;justify-content:center;padding:0 16px 4vh;pointer-events:auto}
#dbox{width:min(880px,100%);background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--cyan);padding:16px 22px 14px;box-shadow:0 10px 60px rgba(0,0,0,.6)}
#dwho{font-size:13px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;margin-bottom:6px}
#dtext{font-size:clamp(16px,1.7vw,21px);line-height:1.45;min-height:2.9em;max-width:68ch}
#dchoices{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.choice{background:rgba(255,255,255,.03);border:1px solid var(--line);border-left:3px solid var(--dim);text-align:left;padding:10px 14px;font-size:17px;font-weight:600;cursor:pointer;display:flex;justify-content:space-between;gap:16px}
.choice small{font-weight:500;opacity:.85}
.choice.good{border-left-color:var(--good)}.choice.good small{color:var(--good)}
.choice.evil{border-left-color:var(--evil)}.choice.evil small{color:var(--evil)}
.choice:hover,.choice.focus{background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.5)}
#dhint{display:flex;justify-content:flex-end;align-items:center;gap:6px;font-size:13px;color:var(--dim);margin-top:8px}
/* ---------- pause ---------- */
#pause{background:rgba(4,5,10,.84);backdrop-filter:blur(3px);align-items:stretch;justify-content:center;overflow:hidden}
.pwrap{width:min(1120px,100%);height:100%;padding:4vh 24px 3vh;display:flex;flex-direction:column;gap:18px}
#pbody{flex:1;min-height:0;overflow:auto;scrollbar-width:thin}
.phead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding-bottom:12px}
.ptitle{font-family:var(--font-display);font-size:40px;margin:0;color:#e6fbff;text-shadow:0 0 14px var(--cyan)}
.tabs{display:flex;gap:6px;align-items:center}
.tab{background:transparent;border:1px solid transparent;padding:6px 14px;font-size:15px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);cursor:pointer}
.tab.sel{color:#fff;border-color:var(--line);background:rgba(255,255,255,.06)}
.tab.focus{color:#fff;border-color:var(--cyan)}
.stats{display:flex;flex-wrap:wrap;gap:22px;font-size:15px;color:var(--dim)}
.stats b{color:var(--ink);font-variant-numeric:tabular-nums}
.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
@media (max-width:820px){.cols{grid-template-columns:1fr}}
.col h3{margin:0 0 4px;font-size:15px;letter-spacing:.18em;text-transform:uppercase}
.col p.req{margin:0 0 10px;font-size:13px;color:var(--dim)}
.col.good h3{color:var(--good)}.col.evil h3{color:var(--evil)}
.card{display:block;width:100%;text-align:left;background:rgba(255,255,255,.03);border:1px solid var(--line);padding:10px 12px;margin-bottom:8px;cursor:pointer}
.card .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.card .nm{font-weight:700;font-size:15px;letter-spacing:.06em}
.card .ds{font-size:13.5px;color:#b9c0d4;margin-top:4px;line-height:1.35}
.card .st{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-top:6px}
.pips{display:flex;gap:3px}.pips i{width:12px;height:5px;background:rgba(255,255,255,.14);display:block}.pips i.f{background:var(--gold);box-shadow:0 0 6px var(--gold)}
.card.can .st{color:var(--gold)}
.card.lock{opacity:.45}
.card:hover,.card.focus{border-color:#fff;background:rgba(255,255,255,.08)}
.col.good .card.focus{border-color:var(--good)}.col.evil .card.focus{border-color:var(--evil)}
.ctl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px}
@media (max-width:820px){.ctl{grid-template-columns:1fr}}
.ctl h3{margin:0 0 10px;font-size:14px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
.ctl ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.ctl li{display:flex;align-items:center;gap:12px;font-size:16px}
.ctl li .k{min-width:84px;display:flex;justify-content:flex-end}
.ctl li span.d{color:#c7cde0}
.ctl li.fixed{padding:2px 8px;opacity:.75}
.bind{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:transparent;border:1px solid transparent;padding:2px 8px;font-size:inherit;cursor:pointer}
.bind:hover,.bind.focus{border-color:var(--cyan);background:rgba(60,224,255,.08)}
.bind .wait{color:var(--gold);font-weight:700}
.rst{margin-top:12px;padding:6px 14px;font-size:12px}
.bindmsg{margin:14px 0 0;font-size:13px;color:var(--dim)}
.setgrid{display:flex;flex-direction:column;gap:8px;max-width:560px}
.sethead{margin:10px 0 0;font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}.sethead:first-child{margin-top:0}
.set.warn .v{color:var(--evil)}
.set{display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,.03);border:1px solid var(--line);padding:12px 14px;font-size:16px;font-weight:600;cursor:pointer;text-align:left}
.set.focus,.set:hover{border-color:var(--cyan);background:rgba(255,255,255,.07)}
.set .v{color:var(--cyan);font-variant-numeric:tabular-nums}
.pfoot{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:12px}
.pfoot .acts{display:flex;gap:8px}
.pbtn{background:rgba(255,255,255,.04);border:1px solid var(--line);padding:10px 18px;font-size:15px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;cursor:pointer}
.pbtn.focus,.pbtn:hover{border-color:var(--cyan);color:#fff;background:rgba(60,224,255,.12)}
.hints{display:flex;gap:16px;font-size:13px;color:var(--dim);align-items:center}
.hints span{display:inline-flex;gap:6px;align-items:center}
/* ---------- neon theme: menus styled like the city's signs (colour per item, glow, slanted plates) ---------- */
:root{--purple:#b26bff;--green:#4dff9a}
#title::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.03) 0 1px,transparent 1px 3px)}
#tmenu{margin-top:30px;gap:12px;position:relative;padding-top:24px}
#tmenu::before{content:"";position:absolute;top:0;left:0;width:min(460px,60vw);height:3px;border-radius:2px;background:linear-gradient(90deg,var(--cyan),var(--pink) 60%,transparent);box-shadow:0 0 12px var(--pink),0 0 26px rgba(60,224,255,.6)}
.mbtn{--c:var(--cyan);position:relative;min-width:min(330px,70vw);text-align:left;border:2px solid color-mix(in srgb,var(--c) 55%,transparent);border-radius:4px;transform:skewX(-9deg);padding:10px 26px 10px 22px;
  color:color-mix(in srgb,var(--c) 70%,#fff);background:rgba(6,8,16,.6);text-shadow:0 0 9px color-mix(in srgb,var(--c) 75%,transparent);
  box-shadow:0 0 10px color-mix(in srgb,var(--c) 28%,transparent),inset 0 0 14px color-mix(in srgb,var(--c) 12%,transparent);transition:color .12s,background .12s,box-shadow .12s,transform .12s,border-color .12s}
#tmenu .mbtn:nth-child(1){--c:var(--cyan)}#tmenu .mbtn:nth-child(2){--c:var(--pink)}#tmenu .mbtn:nth-child(3){--c:var(--gold)}#tmenu .mbtn:nth-child(4){--c:var(--purple)}
.mbtn:hover,.mbtn.focus{color:#fff;border-color:var(--c);border-left-color:var(--c);transform:skewX(-9deg) translateX(16px);
  background:linear-gradient(90deg,color-mix(in srgb,var(--c) 42%,transparent),color-mix(in srgb,var(--c) 8%,transparent));
  text-shadow:0 0 6px #fff,0 0 14px var(--c);box-shadow:0 0 8px var(--c),0 0 26px color-mix(in srgb,var(--c) 60%,transparent),inset 0 0 18px color-mix(in srgb,var(--c) 30%,transparent)}
.mbtn.focus::before{content:"";position:absolute;left:-20px;top:50%;width:9px;height:9px;margin-top:-5px;background:var(--c);transform:rotate(45deg);box-shadow:0 0 10px var(--c)}
.mbtn[disabled]{opacity:.32;box-shadow:none;text-shadow:none}
.padstat{margin-top:30px}
#pause{background:radial-gradient(110% 80% at 15% 0%,rgba(60,224,255,.13),transparent 55%),radial-gradient(110% 80% at 100% 100%,rgba(255,61,139,.14),transparent 55%),rgba(4,5,12,.87)}
.phead{border-bottom:2px solid;border-image:linear-gradient(90deg,var(--cyan),var(--pink) 55%,transparent) 1}
.pfoot{border-top:2px solid;border-image:linear-gradient(90deg,transparent,var(--pink) 45%,var(--cyan)) 1}
.ptitle{color:#fff;text-shadow:0 0 6px #fff,0 0 16px var(--cyan),0 0 38px var(--cyan)}
.tab{border-radius:3px;transform:skewX(-9deg);border-width:2px}
.tab.sel{color:#fff;border-color:var(--pink);background:rgba(255,61,139,.16);text-shadow:0 0 9px var(--pink);box-shadow:0 0 14px rgba(255,61,139,.5),inset 0 0 12px rgba(255,61,139,.22)}
.tab.focus{border-color:var(--cyan);box-shadow:0 0 14px rgba(60,224,255,.6)}
.stats b{text-shadow:0 0 8px currentColor}
.col{--cc:var(--gold)}.col.good{--cc:var(--good)}.col.evil{--cc:var(--evil)}
.col h3{color:var(--cc);text-shadow:0 0 10px color-mix(in srgb,var(--cc) 70%,transparent)}
.card{border-left:3px solid var(--cc);border-radius:3px;background:linear-gradient(90deg,color-mix(in srgb,var(--cc) 9%,transparent),rgba(255,255,255,.02) 60%)}
.card:hover,.card.focus,.col.good .card.focus,.col.evil .card.focus{border-color:var(--cc);background:linear-gradient(90deg,color-mix(in srgb,var(--cc) 24%,transparent),color-mix(in srgb,var(--cc) 5%,transparent));box-shadow:0 0 16px color-mix(in srgb,var(--cc) 50%,transparent),inset 0 0 16px color-mix(in srgb,var(--cc) 14%,transparent)}
.card.can .st{text-shadow:0 0 8px var(--gold)}
.sethead{color:var(--pink);text-shadow:0 0 9px rgba(255,61,139,.65)}
.set{border-left:3px solid color-mix(in srgb,var(--cyan) 60%,transparent);border-radius:3px}
.set.focus,.set:hover{box-shadow:0 0 16px rgba(60,224,255,.45),inset 0 0 16px rgba(60,224,255,.12);background:linear-gradient(90deg,rgba(60,224,255,.2),rgba(60,224,255,.04))}
.set .v{text-shadow:0 0 9px currentColor}
.set.warn{border-left-color:var(--evil)}
.pbtn{--c:var(--cyan);border:2px solid color-mix(in srgb,var(--c) 60%,transparent);border-radius:3px;transform:skewX(-9deg);color:color-mix(in srgb,var(--c) 70%,#fff);background:rgba(6,8,16,.6);
  text-shadow:0 0 8px color-mix(in srgb,var(--c) 70%,transparent);box-shadow:0 0 10px color-mix(in srgb,var(--c) 25%,transparent)}
#bQuit{--c:var(--pink)}.rst{--c:var(--gold)}
.pbtn.focus,.pbtn:hover{border-color:var(--c);color:#fff;background:color-mix(in srgb,var(--c) 26%,transparent);box-shadow:0 0 8px var(--c),0 0 24px color-mix(in srgb,var(--c) 55%,transparent)}
.ctl h3{color:var(--cyan);text-shadow:0 0 9px rgba(60,224,255,.6)}.ctl>div:nth-child(2) h3{color:var(--pink);text-shadow:0 0 9px rgba(255,61,139,.6)}
.looks{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.look{--cc:var(--cyan);display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 10px 12px;background:linear-gradient(180deg,color-mix(in srgb,var(--cc) 10%,transparent),rgba(255,255,255,.02));border:2px solid var(--line);border-radius:4px;cursor:pointer}
.look canvas{width:108px;height:138px;image-rendering:pixelated}
.look .nm{font-weight:700;font-size:15px;letter-spacing:.1em;text-transform:uppercase}
.look .st{font-size:12px;letter-spacing:.06em;color:var(--dim);text-align:center;min-height:2.4em;line-height:1.2}
.look.on{--cc:var(--gold);border-color:var(--gold);box-shadow:0 0 14px color-mix(in srgb,var(--gold) 45%,transparent)}.look.on .st{color:var(--gold)}
.look.lock canvas{filter:brightness(0) opacity(.55)}.look.lock .nm{color:var(--dim)}
.look:hover,.look.focus{border-color:var(--cc);box-shadow:0 0 18px color-mix(in srgb,var(--cc) 55%,transparent),inset 0 0 18px color-mix(in srgb,var(--cc) 14%,transparent)}
.lookhint{margin:0 0 12px;font-size:13px;color:var(--dim)}
.bind{border-radius:3px}.bind:hover,.bind.focus{box-shadow:0 0 14px rgba(60,224,255,.4),inset 0 0 12px rgba(60,224,255,.1)}
@media (max-height:520px){#tmenu{margin-top:10px}.mbtn{padding:4px 14px 4px 12px;font-size:17px}.menu{gap:2px}.padstat{margin-top:12px;font-size:12px}#title{padding-bottom:4vh}
  .pwrap{padding:10px 20px 8px;gap:8px}.phead{padding-bottom:6px}.ptitle{font-size:24px}.tab{padding:4px 12px;font-size:13px}.pfoot{padding-top:6px}.pbtn{padding:6px 14px;font-size:13px}
  .ctl{gap:20px}.ctl h3{margin-bottom:5px;font-size:12px}.ctl ul{gap:2px}.ctl li{font-size:12.5px;gap:8px}.ctl li .k{min-width:60px}}
@media (prefers-reduced-motion:reduce){.logo span{animation:none}}
/* ---------- title screen: the ordinary-city look (painted signs, no neon). Overrides the neon theme above for the title only. ---------- */
#title{background:linear-gradient(90deg,rgba(24,16,18,.9) 0%,rgba(24,16,18,.6) 40%,rgba(24,16,18,0) 72%)}
#title::after{display:none}
.logo{font-family:"Bungee","Impact","Arial Black",var(--font-body);font-size:clamp(30px,min(7.4vw,12vh),104px);line-height:1;letter-spacing:.01em;color:#f6e7c1;animation:none;
  text-shadow:.045em .045em 0 #b8412c,.09em .09em 0 #2a1614,0 0 0 transparent;-webkit-text-stroke:.02em #2a1614}
.logo span{display:inline;color:inherit;text-shadow:inherit;animation:none}
#tmenu{margin-top:26px;gap:9px;padding-top:20px}
#tmenu::before{height:4px;border-radius:0;width:min(380px,60vw);background:#f6e7c1;box-shadow:3px 3px 0 #2a1614}
#title .mbtn{font-family:"Bungee","Impact","Arial Black",var(--font-body);font-weight:400;letter-spacing:.04em;min-width:min(300px,70vw);transform:none;border:3px solid #f6e7c1;border-radius:5px;padding:8px 20px;
  color:#f6e7c1;background:#1f6b4a;text-shadow:none;box-shadow:4px 4px 0 #2a1614;transition:transform .1s,background .1s,color .1s}
#title .mbtn:nth-child(n){--c:#e0b040}
#title .mbtn:hover,#title .mbtn.focus{color:#2a1614;background:#e0b040;border-color:#f6e7c1;transform:translate(10px,0);text-shadow:none;box-shadow:4px 4px 0 #2a1614}
#title .mbtn.focus::before{left:-22px;width:0;height:0;margin-top:-8px;background:none;transform:none;box-shadow:none;border:8px solid transparent;border-left:11px solid #f6e7c1}
#title .mbtn[disabled]{opacity:.5;background:#4a4a4a;box-shadow:4px 4px 0 #2a1614}
#title .padstat{color:#e8dcc0;text-shadow:1px 1px 0 #2a1614}
#title .padstat.ok .dot{background:#6fd08a;box-shadow:none}#title .padstat.warn .dot{box-shadow:none}
/* ---------- pause menu: painted-sign look to match the title (no glow). Scoped to #pause so it wins over the neon theme above. ---------- */
#pause{--gold:#e0b040;--good:#5aa8e0;--evil:#d0503a;--ink:#f1e6cc;--dim:#b5a68e;background:rgba(30,22,22,.9);backdrop-filter:blur(3px);color:var(--ink)}
#pause .phead{border-bottom:4px solid #f6e7c1;border-image:none;box-shadow:0 3px 0 #170e0c}
#pause .pfoot{border-top:4px solid #f6e7c1;border-image:none}
#pause .ptitle{font-family:"Bungee","Impact","Arial Black",var(--font-body);font-size:38px;color:#f6e7c1;text-shadow:.05em .05em 0 #b8412c,.1em .1em 0 #170e0c}
#pause .tab{font-family:"Bungee","Impact","Arial Black",var(--font-body);font-weight:400;letter-spacing:.06em;transform:none;border:3px solid transparent;border-radius:5px;color:var(--dim);text-shadow:none;box-shadow:none;background:transparent}

#pause .stats b,#pause .col h3,#pause .card.can .st,#pause .set .v,#pause .ctl h3{text-shadow:none}
#pause .col{--cc:#e0b040}#pause .col.good{--cc:var(--good)}#pause .col.evil{--cc:var(--evil)}

#pause .card:hover,#pause .card.focus{border-left-color:var(--cc)}

#pause .ctl h3{color:#e0b040}#pause .ctl>div:nth-child(2) h3{color:#d0503a}
#pause .ctl li span.d{color:#d2c4a8}
#pause .bind:hover,#pause .bind.focus{border-color:#e0b040;background:rgba(224,176,64,.12);box-shadow:none}
#pause .look.on{border-color:#e0b040}#pause .look.on .st{color:#e0b040}
#pause .pbtn{font-family:"Bungee","Impact","Arial Black",var(--font-body);font-weight:400;letter-spacing:.06em;transform:none;border:3px solid #f6e7c1;border-radius:5px;color:#f6e7c1;background:#1f6b4a;text-shadow:none;box-shadow:3px 3px 0 #170e0c}
#pause #bQuit{background:#a8402c}#pause .rst{background:#8a6420}
#pause .pbtn:hover,#pause .pbtn.focus{color:#2a1614;background:#e0b040;border-color:#f6e7c1;box-shadow:3px 3px 0 #170e0c}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="title" class="layer on">
  <h1 class="logo">GRAVITATION</h1>
  <div class="menu" id="tmenu">
    <button class="mbtn nav" id="bNew">New game</button>
    <button class="mbtn nav" id="bCont">Continue</button>
    <button class="mbtn nav" id="bCtl">Controls</button>
    <button class="mbtn nav" id="bSet">Settings</button>
  </div>
  <div class="padstat" id="padstat"><span class="dot"></span><span id="padtxt">Press any button on your controller.</span></div>
</div>

<div id="dlg" class="layer">
  <div id="dbox">
    <div id="dwho"></div>
    <div id="dtext"></div>
    <div id="dchoices"></div>
    <div id="dhint"><span class="g" data-act="confirm"></span><span>Continue</span></div>
  </div>
</div>

<div id="pause" class="layer">
  <div class="pwrap">
    <div class="phead">
      <h2 class="ptitle" id="ptitle">Paused</h2>
      <div class="tabs" id="tabs">
        <span class="g" data-act="tabL"></span>
        <button class="tab nav" data-tab="skills">Skills</button>
        <button class="tab nav" data-tab="looks">Costumes</button>
        <button class="tab nav" data-tab="controls">Controls</button>
        <button class="tab nav" data-tab="settings">Settings</button>
        <span class="g" data-act="tabR"></span>
      </div>
    </div>
    <div id="pbody"></div>
    <div class="pfoot">
      <div class="hints"><span><span class="g" data-act="confirm"></span>Select</span><span><span class="g" data-act="back"></span><span id="backLbl">Resume</span></span></div>
      <div class="acts"><button class="pbtn nav" id="bResume">Resume</button><button class="pbtn nav" id="bQuit">Quit to title</button></div>
    </div>
  </div>
</div>

<script>
/*__JS__*/
</script>
</body>
</html>
